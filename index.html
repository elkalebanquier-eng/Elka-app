<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kiko Depth Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0d;
    --panel:#151519;
    --panel-2:#1e1e24;
    --line:#2a2a31;
    --text:#f2f2f4;
    --sub:#9a9aa4;
    --accent:#5b8cff;
    --accent-2:#8b6bff;
    --danger:#ff5b6e;
    --ok:#3ddc84;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    overflow-x:hidden;
    -webkit-user-select:none;
    user-select:none;
  }
  input,button,select{font-family:inherit;}
  button{cursor:pointer;}
  .screen{display:none; min-height:100vh; min-height:100dvh; flex-direction:column;}
  .screen.active{display:flex;}

  /* ---------- HOME ---------- */
  #home{align-items:center; justify-content:center; padding:32px 24px; gap:28px; text-align:center;
    background:radial-gradient(circle at 50% 0%, #14141c 0%, #0a0a0d 60%);}
  .logo-mark{
    width:96px; height:96px; border-radius:26px;
    background:linear-gradient(145deg,var(--accent-2),var(--accent));
    display:flex; align-items:center; justify-content:center;
    font-size:34px; font-weight:900; letter-spacing:-1px;
    box-shadow:0 10px 40px -8px rgba(91,140,255,.55);
  }
  .app-title{font-size:26px; font-weight:700; margin:0; letter-spacing:-.02em;}
  .app-sub{color:var(--sub); font-size:14px; margin:-14px 0 6px; max-width:280px; line-height:1.5;}
  .home-actions{display:flex; flex-direction:column; gap:12px; width:100%; max-width:340px;}
  .big-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:18px 20px; border-radius:16px; border:none;
    font-size:16px; font-weight:600; width:100%;
  }
  .big-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff;}
  .big-btn.secondary{background:var(--panel-2); color:var(--text); border:1px solid var(--line);}
  .home-note{color:#6d6d78; font-size:12px; max-width:300px; line-height:1.6; margin-top:6px;}
  input[type=file]{display:none;}

  /* ---------- EDITOR ---------- */
  #editor{background:var(--bg);}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 14px calc(10px + env(safe-area-inset-top,0px));
    padding-top:calc(14px + env(safe-area-inset-top,0px));
  }
  .icon-btn{
    width:40px; height:40px; border-radius:12px; border:none;
    background:var(--panel-2); color:var(--text); font-size:18px;
    display:flex; align-items:center; justify-content:center;
  }
  .topbar h2{font-size:15px; font-weight:600; margin:0; color:var(--sub);}
  .canvas-wrap{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:6px 14px; position:relative; min-height:0;
  }
  #stage{
    max-width:100%; max-height:100%; border-radius:14px;
    touch-action:none; box-shadow:0 20px 60px -20px rgba(0,0,0,.7);
    background:#000;
  }
  .status-pill{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.65); backdrop-filter:blur(6px);
    padding:8px 16px; border-radius:100px; font-size:13px; color:#fff;
    display:none; align-items:center; gap:8px;
  }
  .status-pill.show{display:flex;}
  .spinner{width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .quick-row{display:flex; gap:8px; padding:0 14px 10px; overflow-x:auto;}
  .chip{
    flex:0 0 auto; padding:9px 16px; border-radius:100px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--sub); font-size:13px; font-weight:600; white-space:nowrap;
  }
  .chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}

  .panel{
    background:var(--panel); border-top-left-radius:24px; border-top-right-radius:24px;
    padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; gap:14px;
    max-height:52vh; overflow-y:auto;
  }
  .tabs{display:flex; gap:6px; background:var(--panel-2); padding:4px; border-radius:12px;}
  .tab{flex:1; text-align:center; padding:9px 4px; border:none; background:transparent; color:var(--sub); font-size:13px; font-weight:600; border-radius:9px;}
  .tab.active{background:var(--accent); color:#fff;}
  .tab-panel{display:none; flex-direction:column; gap:14px;}
  .tab-panel.active{display:flex;}

  .row{display:flex; align-items:center; gap:12px;}
  .row label{font-size:13px; color:var(--sub); width:66px; flex:0 0 66px;}
  input[type=range]{flex:1; accent-color:var(--accent); height:4px;}
  input[type=color]{width:40px; height:40px; border-radius:10px; border:none; background:transparent; padding:0;}

  .style-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .style-card{
    border-radius:12px; border:1px solid var(--line); background:var(--panel-2);
    padding:12px 6px; text-align:center; font-size:12px; color:var(--sub); font-weight:600;
  }
  .style-card.active{border-color:var(--accent); color:#fff; background:rgba(91,140,255,.15);}
  .style-card .preview{font-size:14px; color:var(--text); margin-bottom:4px; display:block;}

  .toggle-row{display:flex; align-items:center; justify-content:space-between;}
  .switch{width:44px; height:26px; border-radius:100px; background:var(--panel-2); border:1px solid var(--line); position:relative; flex:0 0 auto;}
  .switch.on{background:var(--accent); border-color:var(--accent);}
  .switch::after{content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s;}
  .switch.on::after{left:20px;}

  .action-row{display:flex; gap:10px;}
  .action-btn{flex:1; padding:13px; border-radius:14px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px;}
  .action-btn.gold{background:linear-gradient(135deg,var(--accent-2),var(--accent)); color:#fff; border:none;}

  .save-btn{
    width:100%; padding:16px; border-radius:16px; border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff;
    font-size:15px; font-weight:700;
  }

  /* ---------- EXPORT SHEET ---------- */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; justify-content:center; z-index:50;}
  .overlay.show{display:flex;}
  .sheet{
    width:100%; max-width:480px; background:var(--panel);
    border-top-left-radius:22px; border-top-right-radius:22px;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; gap:14px;
  }
  .sheet h3{margin:0; font-size:16px; display:flex; align-items:center; gap:8px;}
  .sheet .ok-dot{color:var(--ok);}
  .share-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .share-item{display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--panel-2); border:1px solid var(--line); border-radius:14px; padding:12px 4px; font-size:11px; color:var(--sub);}
  .share-item .em{font-size:22px;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:#1c1c22; color:#fff; padding:12px 18px; border-radius:12px;
    font-size:13px; z-index:80; display:none; max-width:86vw; text-align:center; border:1px solid var(--line);
  }
  .toast.show{display:block;}

  .close-sheet{align-self:center; color:var(--sub); font-size:13px; padding:6px 14px; background:none; border:none;}

  /* ---------- ENGINE LOADING PILL ---------- */
  .engine-pill{
    display:flex; align-items:center; gap:8px;
    padding:9px 16px; border-radius:100px;
    background:var(--panel-2); border:1px solid var(--line);
    color:var(--sub); font-size:12.5px; margin-top:2px;
    transition:opacity .3s, transform .3s;
  }
  .engine-pill.ready{color:var(--ok); border-color:rgba(61,220,132,.35); background:rgba(61,220,132,.08);}
  .engine-pill.ready .spinner{display:none;}
  .engine-pill.error{color:var(--danger); border-color:rgba(255,91,110,.35); background:rgba(255,91,110,.08);}
  .engine-pill.error .spinner{display:none;}
  .engine-pill .dot{width:7px; height:7px; border-radius:50%; background:var(--ok); display:none;}
  .engine-pill.ready .dot{display:inline-block;}
  .engine-pill.error .dot{display:inline-block; background:var(--danger);}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<section id="home" class="screen active">
  <div class="logo-mark">⏱</div>
  <h1 class="app-title">Kiko Depth Time</h1>
  <p class="app-sub">Place l'heure derrière ton sujet, comme sur les plus beaux clichés portrait.</p>

  <div class="home-actions">
    <button class="big-btn primary" id="btnPickPhoto">📷 Choisir une photo</button>
    <button class="big-btn secondary" id="btnCamera">📸 Prendre une photo</button>
  </div>
  <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp">
  <input type="file" id="cameraInput" accept="image/*" capture="environment">

  <p class="home-note">Tes photos restent sur ton téléphone. Aucun compte, aucun envoi vers un serveur.</p>

  <div class="engine-pill" id="enginePill">
    <span class="spinner"></span>
    <span id="engineText">Préparation du moteur IA...</span>
  </div>
</section>

<!-- ============ EDITOR ============ -->
<section id="editor" class="screen">
  <div class="topbar">
    <button class="icon-btn" id="btnBack">←</button>
    <h2 id="topbarTitle">Modifier</h2>
    <button class="icon-btn" id="btnBeforeAfter">👁</button>
  </div>

  <div class="canvas-wrap">
    <div class="status-pill" id="statusPill"><span class="spinner"></span><span id="statusText">Analyse de la photo...</span></div>
    <canvas id="stage"></canvas>
  </div>

  <div class="quick-row">
    <button class="chip active" id="fmt24">24h</button>
    <button class="chip" id="fmt12">12h</button>
    <button class="chip" id="btnAuto">✨ Auto</button>
    <button class="chip" id="btnResetPos">↺ Réinitialiser</button>
  </div>

  <div class="panel">
    <div class="tabs">
      <button class="tab active" data-tab="style">Style</button>
      <button class="tab" data-tab="tune">Réglages</button>
      <button class="tab" data-tab="export">Export</button>
    </div>

    <div class="tab-panel active" id="tab-style">
      <div class="style-grid" id="styleGrid"></div>
      <div class="row">
        <label>Couleur</label>
        <input type="color" id="colorPicker" value="#ffffff">
        <input type="range" id="opacityRange" min="20" max="100" value="100" style="flex:1">
      </div>
    </div>

    <div class="tab-panel" id="tab-tune">
      <div class="row"><label>Taille</label><input type="range" id="sizeRange" min="6" max="45" value="18"></div>
      <div class="row"><label>Épaisseur</label><input type="range" id="weightRange" min="1" max="10" value="4"></div>
      <div class="toggle-row">
        <span style="font-size:13px;color:var(--sub);">Ombre portée</span>
        <div class="switch on" id="shadowToggle"></div>
      </div>
    </div>

    <div class="tab-panel" id="tab-export">
      <div class="row">
        <label>Format</label>
        <select id="formatSelect" style="flex:1; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px;">
          <option value="jpg">JPG</option>
          <option value="png">PNG</option>
        </select>
      </div>
      <div class="row" id="qualityRow">
        <label>Qualité</label>
        <input type="range" id="qualityRange" min="50" max="100" value="92">
      </div>
      <button class="save-btn" id="btnSave">⬇️ Enregistrer</button>
    </div>
  </div>
</section>

<!-- ============ EXPORT SHEET ============ -->
<div class="overlay" id="exportOverlay">
  <div class="sheet">
    <h3><span class="ok-dot">✅</span> Photo enregistrée</h3>
    <div class="share-grid">
      <button class="share-item" id="shareNative"><span class="em">📤</span>Partager</button>
      <button class="share-item" id="shareDownload"><span class="em">⬇️</span>Fichier</button>
      <button class="share-item" id="shareWhatsapp"><span class="em">💬</span>WhatsApp</button>
      <button class="share-item" id="shareMore"><span class="em">⋯</span>Plus</button>
    </div>
    <button class="close-sheet" id="closeSheet">Fermer</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- MediaPipe Selfie Segmentation (CDN officiel) -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"
        onload="window.__mediapipeScriptState='loaded'; window.dispatchEvent(new Event('mediapipe-script-loaded'))"
        onerror="window.__mediapipeScriptState='error'; window.dispatchEvent(new Event('mediapipe-script-error'))"></script>

<script>
(function(){
  "use strict";

  /* ===================== ÉTAT GLOBAL ===================== */
  const state = {
    originalBitmap:null,     // ImageBitmap haute résolution (orientation corrigée)
    editCanvas:null,         // canvas basse résolution pour l'édition (photo)
    subjectLayer:null,       // canvas: photo avec alpha = masque (pour l'édition)
    editW:0, editH:0,
    hasSubject:false,
    format24h:true,
    style:'iphone',
    color:'#ffffff',
    opacity:100,
    size:18,                 // en % de la largeur du canvas
    weight:4,
    shadow:true,
    posX:0.5, posY:0.42,     // fraction du canvas (0..1)
    beforeAfter:false,
    exporting:false,
    lastBlobUrl:null,
    lastFilename:null
  };

  const FONT_STYLES = {
    classic:{label:'Classic', family:"'Georgia', 'Times New Roman', serif", weight:'700', italic:false},
    iphone:{label:'iPhone', family:"-apple-system, 'SF Pro Display', 'Segoe UI', Inter, sans-serif", weight:'600', italic:false},
    minimal:{label:'Minimal', family:"'Helvetica Neue', Inter, sans-serif", weight:'300', italic:false},
    bold:{label:'Bold', family:"'Poppins', Inter, sans-serif", weight:'900', italic:false},
    elegant:{label:'Elegant', family:"'Playfair Display', Georgia, serif", weight:'700', italic:true},
    modern:{label:'Modern', family:"'Poppins', Inter, sans-serif", weight:'500', italic:false}
  };

  /* ===================== RÉFÉRENCES DOM ===================== */
  const $ = (id)=>document.getElementById(id);
  const homeScreen = $('home'), editorScreen = $('editor');
  const fileInput = $('fileInput'), cameraInput = $('cameraInput');
  const stage = $('stage'); const ctx = stage.getContext('2d');
  const statusPill = $('statusPill'), statusText = $('statusText');
  const toast = $('toast');
  const enginePill = $('enginePill'), engineText = $('engineText');

  function showToast(msg, ms){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>toast.classList.remove('show'), ms||2600);
  }
  function showStatus(msg){ statusText.textContent = msg; statusPill.classList.add('show'); }
  function hideStatus(){ statusPill.classList.remove('show'); }
  function goto(screenEl){
    [homeScreen, editorScreen].forEach(s=>s.classList.remove('active'));
    screenEl.classList.add('active');
  }

  /* ===================== CHARGEMENT DU MOTEUR MEDIAPIPE ===================== */
  let mediapipeState = 'loading'; // 'loading' | 'ready' | 'error'

  function setEnginePill(mode, text){
    enginePill.classList.remove('ready','error');
    if(mode==='ready') enginePill.classList.add('ready');
    if(mode==='error') enginePill.classList.add('error');
    engineText.textContent = text;
  }

  async function warmUpMediapipe(){
    try{
      if(typeof SelfieSegmentation === 'undefined') throw new Error('script manquant');
      setEnginePill('loading', 'Téléchargement du modèle IA...');
      const seg = getSegmenter();
      if(typeof seg.initialize === 'function'){
        await seg.initialize(); // télécharge le wasm + le modèle
      }
      mediapipeState = 'ready';
      setEnginePill('ready', 'Moteur IA prêt');
      // masque discrètement le badge après un court instant une fois prêt
      setTimeout(()=>{ enginePill.style.opacity='0'; }, 2200);
    }catch(err){
      console.error(err);
      mediapipeState = 'error';
      setEnginePill('error', 'Moteur IA indisponible (vérifie ta connexion)');
    }
  }

  window.addEventListener('mediapipe-script-loaded', warmUpMediapipe);
  window.addEventListener('mediapipe-script-error', ()=>{
    mediapipeState = 'error';
    setEnginePill('error', 'Impossible de charger le moteur IA (hors ligne ?)');
  });
  // Au cas où le script était déjà chargé avant l'attache de ces écouteurs
  if(window.__mediapipeScriptState === 'loaded') warmUpMediapipe();
  else if(window.__mediapipeScriptState === 'error') { mediapipeState='error'; setEnginePill('error','Impossible de charger le moteur IA (hors ligne ?)'); }

  /* ===================== SÉLECTION PHOTO ===================== */
  $('btnPickPhoto').addEventListener('click', ()=>fileInput.click());
  $('btnCamera').addEventListener('click', ()=>cameraInput.click());
  fileInput.addEventListener('change', (e)=>{ if(e.target.files[0]) handleNewPhoto(e.target.files[0]); });
  cameraInput.addEventListener('change', (e)=>{ if(e.target.files[0]) handleNewPhoto(e.target.files[0]); });
  $('btnBack').addEventListener('click', ()=>{ resetEditorState(); goto(homeScreen); });

  async function handleNewPhoto(file){
    if(!file.type || !/^image\/(jpeg|jpg|png|webp)/.test(file.type)){
      showToast("Impossible de lire cette photo.");
      return;
    }
    goto(editorScreen);
    if(mediapipeState==='error'){
      showToast("Le moteur IA n'a pas pu se charger. Vérifie ta connexion puis réessaie.");
    }
    showStatus(mediapipeState==='ready' ? '⏳ Analyse de la photo...' : '⏳ Chargement du moteur IA...');
    try{
      const bitmap = await loadOrientedBitmap(file);
      state.originalBitmap = bitmap;
      buildEditCanvas(bitmap);
      drawStageSize();
      renderPreview(); // affichage immédiat sans le masque, le temps que la segmentation tourne
      await runSegmentationOnEditCanvas();
      autoPlacePosition(true); // place une première fois intelligemment
      renderPreview();
      hideStatus();
    }catch(err){
      console.error(err);
      hideStatus();
      showToast("Analyse du sujet impossible. Essayez une photo où une personne est clairement visible.");
    }
  }

  async function loadOrientedBitmap(file){
    try{
      return await createImageBitmap(file, {imageOrientation:'from-image'});
    }catch(e){
      // Fallback pour navigateurs sans support de imageOrientation
      return await createImageBitmap(file);
    }
  }

  function buildEditCanvas(bitmap){
    const MAX_EDIT_DIM = 1000;
    const scale = Math.min(1, MAX_EDIT_DIM / Math.max(bitmap.width, bitmap.height));
    const w = Math.max(1, Math.round(bitmap.width * scale));
    const h = Math.max(1, Math.round(bitmap.height * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const cctx = c.getContext('2d');
    cctx.drawImage(bitmap, 0, 0, w, h);
    state.editCanvas = c;
    state.editW = w; state.editH = h;
    state.subjectLayer = null;
    state.hasSubject = false;
  }

  function drawStageSize(){
    stage.width = state.editW;
    stage.height = state.editH;
  }

  function resetEditorState(){
    state.originalBitmap = null;
    state.editCanvas = null;
    state.subjectLayer = null;
    state.hasSubject = false;
    state.posX = 0.5; state.posY = 0.42;
    state.beforeAfter = false;
  }

  /* ===================== SEGMENTATION (MediaPipe) ===================== */
  let segmenter = null;
  function getSegmenter(){
    if(segmenter) return segmenter;
    if(typeof SelfieSegmentation === 'undefined'){
      throw new Error('MediaPipe non chargé (connexion internet requise au premier lancement).');
    }
    segmenter = new SelfieSegmentation({
      locateFile: (f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`
    });
    segmenter.setOptions({ modelSelection: 1, selfieMode:false });
    return segmenter;
  }

  function runSegmentation(sourceCanvas){
    return new Promise((resolve, reject)=>{
      try{
        const seg = getSegmenter();
        const timeout = setTimeout(()=>reject(new Error('Segmentation timeout')), 15000);
        seg.onResults((results)=>{
          clearTimeout(timeout);
          resolve(results.segmentationMask);
        });
        seg.send({image: sourceCanvas});
      }catch(err){ reject(err); }
    });
  }

  async function runSegmentationOnEditCanvas(){
    const mask = await runSegmentation(state.editCanvas);
    state.subjectLayer = buildSubjectLayer(state.editCanvas, mask, state.editW, state.editH);
    state.hasSubject = true;
  }

  // Construit un calque "sujet" = photo avec alpha = masque, avec feathering
  function buildSubjectLayer(imgCanvas, maskSource, w, h){
    // 1. dessiner le masque brut
    const maskCanvas = document.createElement('canvas');
    maskCanvas.width = w; maskCanvas.height = h;
    const mctx = maskCanvas.getContext('2d');
    mctx.drawImage(maskSource, 0, 0, w, h);

    // 2. feathering: flou léger + renforcement du contraste pour limiter les halos
    const feather = document.createElement('canvas');
    feather.width = w; feather.height = h;
    const fctx = feather.getContext('2d');
    fctx.filter = 'blur(2.2px)';
    fctx.drawImage(maskCanvas, 0, 0);
    fctx.filter = 'none';

    // 3. légère amélioration du contraste du masque (réduit les bords "sales")
    const maskData = fctx.getImageData(0, 0, w, h);
    const d = maskData.data;
    for(let i=0; i<d.length; i+=4){
      let a = d[i]; // canal rouge = niveau de gris du masque
      // courbe en S légère pour durcir un peu les bords tout en gardant un feathering doux
      const n = a/255;
      const s = n<0.5 ? 2*n*n : 1-Math.pow(-2*n+2,2)/2;
      a = Math.round(((n*0.55)+(s*0.45))*255);
      d[i]=d[i+1]=d[i+2]=255;
      d[i+3]=a;
    }
    fctx.putImageData(maskData, 0, 0);

    // 4. appliquer le masque comme alpha sur la photo
    const subject = document.createElement('canvas');
    subject.width = w; subject.height = h;
    const sctx = subject.getContext('2d');
    sctx.drawImage(imgCanvas, 0, 0);
    sctx.globalCompositeOperation = 'destination-in';
    sctx.drawImage(feather, 0, 0);
    sctx.globalCompositeOperation = 'source-over';
    return subject;
  }

  /* ===================== HORLOGE ===================== */
  function getTimeString(){
    const now = new Date();
    let h = now.getHours();
    const m = now.getMinutes().toString().padStart(2,'0');
    if(state.format24h){
      return `${h.toString().padStart(2,'0')}:${m}`;
    }else{
      const suffix = h>=12 ? 'PM' : 'AM';
      h = h % 12; if(h===0) h=12;
      return `${h.toString().padStart(2,'0')}:${m} ${suffix}`;
    }
  }
  setInterval(()=>{ if(editorScreen.classList.contains('active')) renderPreview(); }, 5000);

  /* ===================== RENDU (PIPELINE PROFONDEUR) ===================== */
  let rafPending = false;
  function requestRender(){
    if(rafPending) return;
    rafPending = true;
    requestAnimationFrame(()=>{ rafPending = false; renderPreview(); });
  }

  function drawTimeText(targetCtx, w, h, text, opts){
    const fs = FONT_STYLES[opts.style] || FONT_STYLES.iphone;
    const fontSizePx = Math.round((opts.size/100) * w * 1.05);
    targetCtx.save();
    targetCtx.font = `${fs.italic?'italic ':''}${fs.weight} ${fontSizePx}px ${fs.family}`;
    targetCtx.textAlign = 'center';
    targetCtx.textBaseline = 'middle';
    targetCtx.globalAlpha = opts.opacity/100;

    if(opts.shadow){
      targetCtx.shadowColor = 'rgba(0,0,0,.45)';
      targetCtx.shadowBlur = fontSizePx*0.12;
      targetCtx.shadowOffsetY = fontSizePx*0.03;
    }

    const x = opts.posX * w;
    const y = opts.posY * h;

    if(opts.weight > 0 && (opts.style==='bold' || opts.style==='classic')){
      targetCtx.lineWidth = (opts.weight/10) * (fontSizePx*0.09);
      targetCtx.strokeStyle = 'rgba(0,0,0,.35)';
      targetCtx.strokeText(text, x, y);
    }

    targetCtx.fillStyle = opts.color;
    targetCtx.fillText(text, x, y);
    targetCtx.restore();
  }

  function renderPreview(){
    if(!state.editCanvas) return;
    const w = state.editW, h = state.editH;
    ctx.clearRect(0,0,w,h);
    // 1. arrière-plan (photo complète)
    ctx.drawImage(state.editCanvas, 0, 0, w, h);

    if(state.beforeAfter){ return; } // mode "avant" simple: juste la photo

    // 2. heure derrière le sujet
    drawTimeText(ctx, w, h, getTimeString(), {
      style:state.style, size:state.size, color:state.color,
      opacity:state.opacity, shadow:state.shadow, weight:state.weight,
      posX:state.posX, posY:state.posY
    });

    // 3. sujet redessiné par-dessus (effet de profondeur)
    if(state.hasSubject && state.subjectLayer){
      ctx.drawImage(state.subjectLayer, 0, 0, w, h);
    }
  }

  /* ===================== INTERACTIONS: DRAG / PINCH ===================== */
  let dragging = false;
  let lastPinchDist = null;

  function canvasPointFromEvent(e){
    const rect = stage.getBoundingClientRect();
    const cx = (e.clientX - rect.left) / rect.width;
    const cy = (e.clientY - rect.top) / rect.height;
    return { x: Math.min(1, Math.max(0, cx)), y: Math.min(1, Math.max(0, cy)) };
  }

  stage.addEventListener('pointerdown', (e)=>{
    if(!state.editCanvas) return;
    dragging = true;
    stage.setPointerCapture(e.pointerId);
    const p = canvasPointFromEvent(e);
    state.posX = p.x; state.posY = p.y;
    requestRender();
  });
  stage.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    const p = canvasPointFromEvent(e);
    state.posX = p.x; state.posY = p.y;
    requestRender();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>{
    stage.addEventListener(ev, ()=>{ dragging=false; });
  });

  // Pincer pour zoomer la taille du texte (2 doigts)
  stage.addEventListener('touchmove', (e)=>{
    if(e.touches.length===2){
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx,dy);
      if(lastPinchDist!=null){
        const delta = (dist - lastPinchDist) * 0.06;
        state.size = Math.min(45, Math.max(6, state.size + delta));
        $('sizeRange').value = Math.round(state.size);
        requestRender();
      }
      lastPinchDist = dist;
    }
  }, {passive:false});
  stage.addEventListener('touchend', (e)=>{ if(e.touches.length<2) lastPinchDist=null; });

  /* ===================== CONTRÔLES UI ===================== */
  // Tabs
  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      $('tab-'+tab.dataset.tab).classList.add('active');
    });
  });

  // Styles
  const styleGrid = $('styleGrid');
  Object.keys(FONT_STYLES).forEach(key=>{
    const s = FONT_STYLES[key];
    const card = document.createElement('button');
    card.className = 'style-card' + (key===state.style?' active':'');
    card.dataset.style = key;
    card.innerHTML = `<span class="preview" style="font-family:${s.family}; font-weight:${s.weight}; font-style:${s.italic?'italic':'normal'};">12:45</span>${s.label}`;
    card.addEventListener('click', ()=>{
      document.querySelectorAll('.style-card').forEach(c=>c.classList.remove('active'));
      card.classList.add('active');
      state.style = key;
      requestRender();
    });
    styleGrid.appendChild(card);
  });

  $('colorPicker').addEventListener('input', (e)=>{ state.color = e.target.value; requestRender(); });
  $('opacityRange').addEventListener('input', (e)=>{ state.opacity = +e.target.value; requestRender(); });
  $('sizeRange').addEventListener('input', (e)=>{ state.size = +e.target.value; requestRender(); });
  $('weightRange').addEventListener('input', (e)=>{ state.weight = +e.target.value; requestRender(); });
  $('shadowToggle').addEventListener('click', (e)=>{
    state.shadow = !state.shadow;
    e.target.classList.toggle('on', state.shadow);
    requestRender();
  });

  $('fmt24').addEventListener('click', ()=>{ state.format24h=true; $('fmt24').classList.add('active'); $('fmt12').classList.remove('active'); requestRender(); });
  $('fmt12').addEventListener('click', ()=>{ state.format24h=false; $('fmt12').classList.add('active'); $('fmt24').classList.remove('active'); requestRender(); });

  $('btnResetPos').addEventListener('click', ()=>{ state.posX=0.5; state.posY=0.42; state.size=18; requestRender(); });

  $('btnBeforeAfter').addEventListener('pointerdown', ()=>{ state.beforeAfter = true; renderPreview(); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>{
    $('btnBeforeAfter').addEventListener(ev, ()=>{ state.beforeAfter = false; renderPreview(); });
  });

  /* ===================== AUTO PLACEMENT ===================== */
  $('btnAuto').addEventListener('click', ()=>autoPlacePosition(false));

  function autoPlacePosition(silent){
    if(!state.subjectLayer){ if(!silent) showToast("Analyse du sujet indisponible."); return; }
    const w = state.editW, h = state.editH;
    const off = document.createElement('canvas');
    off.width = w; off.height = h;
    const octx = off.getContext('2d');
    octx.drawImage(state.subjectLayer, 0, 0);
    const data = octx.getImageData(0,0,w,h).data;

    // grille d'occupation du sujet
    const cols = 10, rows = 14;
    const occ = new Array(cols*rows).fill(0);
    for(let gy=0; gy<rows; gy++){
      for(let gx=0; gx<cols; gx++){
        let sum=0, count=0;
        const x0 = Math.floor(gx/cols*w), x1 = Math.floor((gx+1)/cols*w);
        const y0 = Math.floor(gy/rows*h), y1 = Math.floor((gy+1)/rows*h);
        for(let y=y0; y<y1; y+=3){
          for(let x=x0; x<x1; x+=3){
            const idx = (y*w+x)*4+3;
            sum += data[idx]; count++;
          }
        }
        occ[gy*cols+gx] = count? sum/count/255 : 0;
      }
    }

    // cherche la meilleure zone libre (3x2 cellules) proche du centre horizontal, en évitant les bords extrêmes
    let best = {score:Infinity, gx:2, gy:1};
    for(let gy=0; gy<rows-2; gy++){
      for(let gx=0; gx<cols-3; gx++){
        let occSum=0;
        for(let yy=gy; yy<gy+2; yy++) for(let xx=gx; xx<gx+3; xx++) occSum += occ[yy*cols+xx];
        const centerBias = Math.abs((gx+1.5) - cols/2);
        const score = occSum*10 + centerBias*0.5;
        if(score < best.score){ best = {score, gx, gy}; }
      }
    }
    state.posX = (best.gx+1.5)/cols;
    state.posY = (best.gy+1)/rows;
    if(!silent){ requestRender(); showToast("Position optimisée ✨"); }
  }

  /* ===================== EXPORT ===================== */
  $('formatSelect').addEventListener('change', (e)=>{
    $('qualityRow').style.display = e.target.value==='jpg' ? 'flex' : 'none';
  });

  $('btnSave').addEventListener('click', exportImage);

  async function exportImage(){
    if(!state.originalBitmap || state.exporting) return;
    state.exporting = true;
    showStatus('⏳ Préparation de l’export...');
    try{
      const MAX_EXPORT_DIM = 2200;
      const bmp = state.originalBitmap;
      const scale = Math.min(1, MAX_EXPORT_DIM / Math.max(bmp.width, bmp.height));
      const w = Math.max(1, Math.round(bmp.width*scale));
      const h = Math.max(1, Math.round(bmp.height*scale));

      const fullCanvas = document.createElement('canvas');
      fullCanvas.width = w; fullCanvas.height = h;
      const fctx = fullCanvas.getContext('2d');
      fctx.drawImage(bmp, 0, 0, w, h);

      // re-segmentation en haute résolution pour un meilleur rendu final
      let subjectLayerHD = state.subjectLayer;
      try{
        const mask = await runSegmentation(fullCanvas);
        subjectLayerHD = buildSubjectLayer(fullCanvas, mask, w, h);
      }catch(e){
        // fallback: on agrandit le masque basse résolution
        subjectLayerHD = document.createElement('canvas');
        subjectLayerHD.width = w; subjectLayerHD.height = h;
        subjectLayerHD.getContext('2d').drawImage(state.subjectLayer, 0, 0, w, h);
      }

      const out = document.createElement('canvas');
      out.width = w; out.height = h;
      const octx = out.getContext('2d');
      octx.drawImage(fullCanvas, 0, 0);
      drawTimeText(octx, w, h, getTimeString(), {
        style:state.style, size:state.size, color:state.color,
        opacity:state.opacity, shadow:state.shadow, weight:state.weight,
        posX:state.posX, posY:state.posY
      });
      octx.drawImage(subjectLayerHD, 0, 0);

      const format = $('formatSelect').value;
      const mime = format==='png' ? 'image/png' : 'image/jpeg';
      const quality = format==='png' ? undefined : (+$('qualityRange').value)/100;

      out.toBlob((blob)=>{
        state.exporting = false;
        hideStatus();
        if(!blob){ showToast("Erreur lors de l'enregistrement."); return; }
        const now = new Date();
        const pad = n=>n.toString().padStart(2,'0');
        const fname = `Kiko_Depth_${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}.${format==='png'?'png':'jpg'}`;
        if(state.lastBlobUrl) URL.revokeObjectURL(state.lastBlobUrl);
        state.lastBlobUrl = URL.createObjectURL(blob);
        state.lastFilename = fname;
        state.lastBlob = blob;
        state.lastMime = mime;
        $('exportOverlay').classList.add('show');
      }, mime, quality);

    }catch(err){
      console.error(err);
      state.exporting = false;
      hideStatus();
      showToast("Erreur lors de l'enregistrement. Réessayez.");
    }
  }

  /* ===================== PARTAGE ===================== */
  $('closeSheet').addEventListener('click', ()=>$('exportOverlay').classList.remove('show'));

  $('shareDownload').addEventListener('click', ()=>{
    if(!state.lastBlobUrl) return;
    const a = document.createElement('a');
    a.href = state.lastBlobUrl;
    a.download = state.lastFilename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    showToast('Fichier téléchargé');
  });

  async function tryNativeShare(){
    if(!state.lastBlob) return false;
    try{
      const file = new File([state.lastBlob], state.lastFilename, {type: state.lastMime});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'Kiko Depth Time'});
        return true;
      }
    }catch(e){ /* annulé par l'utilisateur ou non supporté */ }
    return false;
  }

  $('shareNative').addEventListener('click', async ()=>{
    const ok = await tryNativeShare();
    if(!ok) showToast("Le partage direct n'est pas disponible sur ce navigateur. Utilisez « Fichier ».");
  });
  $('shareMore').addEventListener('click', async ()=>{
    const ok = await tryNativeShare();
    if(!ok) showToast("Le partage direct n'est pas disponible sur ce navigateur. Utilisez « Fichier ».");
  });
  $('shareWhatsapp').addEventListener('click', async ()=>{
    // Pas d'intégration factice: on ouvre le sélecteur système, WhatsApp y apparaît si installé.
    const ok = await tryNativeShare();
    if(!ok) showToast("Enregistrez d'abord le fichier, puis partagez-le depuis WhatsApp.");
  });

  /* ===================== ERREURS GLOBALES ===================== */
  window.addEventListener('error', (e)=>{
    console.error(e.error||e.message);
  });

})();
</script>
</body>
</html>
